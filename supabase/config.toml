project_id = "humbble"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["humbble://", "http://localhost:8081"]

# P4 PayPal Sandbox functions. The webhook is called by PayPal (no Supabase JWT);
# it authenticates via PayPal verify-webhook-signature instead.
[functions.paypal-webhook]
verify_jwt = false

[functions.paypal-create-subscription]
verify_jwt = true

[functions.paypal-cancel-subscription]
verify_jwt = true

# Scheduled reconciler (pg_cron + pg_net). Server-to-server only: verify_jwt stays on and the function
# additionally requires the service-role key as Bearer (constant-time compare, same as send-push).
# NOTE: this block only applies to `supabase functions deploy` (CLI). Any other deploy path (MCP/API/dashboard)
# must pass verify_jwt=true explicitly; the Bearer check protects the function either way. If the project moves to
# new-style `sb_secret_...` keys, the gateway JWT check rejects them: switch to verify_jwt=false only together with a
# review of the Bearer comparison.
[functions.paypal-reconcile]
verify_jwt = true
