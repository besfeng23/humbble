name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck # npx tsc --noEmit

      - name: Test
        run: npm test

  database:
    name: Database (Supabase + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Set up PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database and replay migrations
        run: supabase db reset

      - name: Lint database
        run: bash scripts/db/lint.sh

      - name: Check schema drift
        run: bash scripts/db/diff.sh

      - name: Check generated types are current
        run: bash scripts/db/check-types-drift.sh

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run concurrent reciprocal-like integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash supabase/tests/concurrency/reciprocal_likes.sh

      - name: Run concurrent swipe quota integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash supabase/tests/concurrency/swipe_quota.sh
